name: CI/CD Pipeline with SonarQube

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Validate
      - name: Validate
        run: mvn validate


      # 4. Compile
      - name: Compile
        run: mvn compile


      # 5. Test
      - name: Test
        run: mvn test


      # 6. Package
      - name: Package
        run: mvn package
name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-sonarqube-nexus-tomcat:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build and test
      - name: Build Application
        run: |
          mvn clean package

      # 4. SonarQube analysis
      - name: SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 5. Upload WAR file to Nexus
      - name: Upload WAR to Nexus
        run: |
          mvn deploy \
            -DskipTests \
            -Dnexus.username=${{ secrets.NEXUS_USERNAME }} \
            -Dnexus.password=${{ secrets.NEXUS_PASSWORD }}

      # 6. Download WAR from build
      - name: Find WAR File
        run: |
          ls -la target/

      # 7. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        run: |
          curl -u "${{ secrets.TOMCAT_USER_PROJECT }}:${{ secrets.TOMCAT_PASS_PROJECT }}" \
          --upload-file target/*.war \
          "${{ secrets.TOMCAT_URL_PROJECT }}/manager/text/deploy?path=/myapp&update=true"
